<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    BiliSeek logo（白底蓝线）。app/src/main/res/drawable/ 下的 ic_launcher_foreground、
    ic_launcher_monochrome、media3_notification_small_icon 都用这里的同一套 path（1024 坐标系），
    只在外层 group 上缩放。改图形时三处一起改。
  -->
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- 机身边框在镜柄处断开：外框顺时针 + 镜柄周围胶囊逆时针，nonzero 规则下挖出一个洞 -->
  <clipPath id="handle-gap">
    <path d="M-200,-200 H1224 V1224 H-200 Z M780.9,741.5 L899.4,883.6 A78,78 0 0 0 1019.2,783.6 L900.7,641.5 A78,78 0 0 0 780.9,741.5 Z"/>
  </clipPath>
  <g fill="none" stroke="#0496FF" stroke-linecap="round" stroke-linejoin="round">
    <!-- 机身 -->
    <path clip-path="url(#handle-gap)" stroke-width="62" d="M201,235 H780 A115,115 0 0 1 895,350 V712 A115,115 0 0 1 780,827 H201 A115,115 0 0 1 86,712 V350 A115,115 0 0 1 201,235 Z"/>
    <!-- 天线 -->
    <path stroke-width="62" d="M285,80 L415,212 M685,80 L555,212"/>
    <!-- 机脚 -->
    <path stroke-width="75" d="M242,845 L242,860 M743,845 L743,860"/>
    <!-- 眨眼 + 微笑 -->
    <path stroke-width="56" d="M242,515 L390,462"/>
    <path stroke-width="56" d="M360,650 Q465,780 565,668"/>
    <!-- 放大镜：镜片 + 镜中弯眼 + 镜颈 + 镜柄 -->
    <path stroke-width="46" d="M516,488 A155,155 0 1 1 826,488 A155,155 0 1 1 516,488 Z"/>
    <path stroke-width="46" d="M590,512 Q672,410 755,512"/>
    <path stroke-width="40" d="M773.5,610.9 L831.2,680"/>
    <path stroke-width="88" d="M840.8,691.5 L959.3,833.6"/>
  </g>
</svg>
