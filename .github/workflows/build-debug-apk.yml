name: Build Debug APK

# 手动触发：需要一个能装到手机上验证的 debug 包时，去 Actions 页面点 "Run workflow"。
# 不自动挂在 push 上，避免每次提交都往 Releases 页面塞一个包。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Diagnose available SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "--- available platforms (API 30+) ---"
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-([3-9][0-9]|[A-Za-z])" || echo "(none matched)"
          echo "--- available build-tools (30+) ---"
          "$SDKMANAGER" --list 2>/dev/null | grep -E "build-tools;([3-9][0-9]|[A-Za-z])" || echo "(none matched)"

      - name: Install SDK platform & build-tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare release metadata
        id: vars
        run: |
          echo "tag=debug-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Rename APK for release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            "dist/BiliSeek-debug-${{ steps.vars.outputs.tag }}-${{ steps.vars.outputs.sha_short }}.apk"

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "Debug build #${{ github.run_number }} (${{ steps.vars.outputs.sha_short }})"
          prerelease: true
          files: dist/*.apk
          body: |
            自动编译的 debug 包，仅供本机安装验证，不是正式发布版本。

            - 分支: `${{ github.ref_name }}`
            - Commit: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
