name: Build Release (draft)

# 手动触发的正式版构建，按 docs/发版清单.md 自动化「能自动化的部分」：
#   单测 → R8 release 构建 + 签名 → 归档 APK 与 mapping.txt → 验签 → 生成 **草稿** Release。
# 不能自动化、必须人来做的（清单 §2）：release 包真机/模拟器跑通 Part A 回归、确认仓库公开、
# 确认签名密钥有备份——做完后再到 Releases 页把草稿「Publish」。
#
# 前置：
#   1. 已在 app/build.gradle.kts 提升 versionCode / versionName（清单 §0）。同名 tag 已存在会直接失败。
#   2. 仓库 Settings → Secrets and variables → Actions 配好四个 secret：
#        BILISEEK_KEYSTORE_BASE64            release keystore 的 base64（base64 -w0 biliseek-release.jks）
#        BILISEEK_SIGNING_KEYALIAS           key alias
#        BILISEEK_SIGNING_KEYSTOREPASSWORD   keystore 口令
#        BILISEEK_SIGNING_KEYPASSWORD        key 口令
#      名字与 app/build.gradle.kts 读取的环境变量一致（signing.xxx → BILISEEK_SIGNING_XXX）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Android build
        uses: ./.github/actions/setup-android

      - name: Read version
        id: ver
        run: |
          name=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          code=$(sed -n 's/^ *versionCode = \([0-9]*\)/\1/p' app/build.gradle.kts | head -1)
          test -n "$name" && test -n "$code" || { echo "::error::读不到 versionName / versionCode"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          echo "版本：$name（versionCode $code）"

      - name: Refuse to re-release an existing version
        run: |
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null; then
            echo "::error::tag ${{ steps.ver.outputs.tag }} 已存在。先按发版清单 §0 提升 versionCode / versionName。"
            exit 1
          fi

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.BILISEEK_KEYSTORE_BASE64 }}
          KEYALIAS: ${{ secrets.BILISEEK_SIGNING_KEYALIAS }}
          STOREPASS: ${{ secrets.BILISEEK_SIGNING_KEYSTOREPASSWORD }}
          KEYPASS: ${{ secrets.BILISEEK_SIGNING_KEYPASSWORD }}
        run: |
          # 缺 secret 时 Gradle 会静默产出未签名包——那不是可发布的版本，这里直接失败。
          for v in KEYSTORE_B64 KEYALIAS STOREPASS KEYPASS; do
            test -n "${!v}" || { echo "::error::缺少签名 secret（见本文件头注释）"; exit 1; }
          done
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/biliseek-release.jks"
          echo "BILISEEK_SIGNING_KEYPATH=$RUNNER_TEMP/biliseek-release.jks" >> "$GITHUB_ENV"

      - name: Unit tests + release build + archive
        env:
          BILISEEK_SIGNING_KEYALIAS: ${{ secrets.BILISEEK_SIGNING_KEYALIAS }}
          BILISEEK_SIGNING_KEYSTOREPASSWORD: ${{ secrets.BILISEEK_SIGNING_KEYSTOREPASSWORD }}
          BILISEEK_SIGNING_KEYPASSWORD: ${{ secrets.BILISEEK_SIGNING_KEYPASSWORD }}
        run: ./gradlew test :app:archiveReleaseArtifacts --stacktrace

      - name: Check archive and signature
        id: out
        run: |
          dir="releases/${{ steps.ver.outputs.name }}"
          apk="$dir/app-release.apk"
          # 清单：没有 mapping.txt 就不算一次发版
          test -s "$dir/mapping.txt" || { echo "::error::mapping.txt 缺失"; exit 1; }
          test -s "$apk" || { echo "::error::app-release.apk 缺失（多半是未签名，产物名为 app-release-unsigned.apk）"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          final="BiliSeek-${{ steps.ver.outputs.name }}.apk"
          cp "$apk" "$dir/$final"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "apk=$dir/$final" >> "$GITHUB_OUTPUT"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/biliseek-release.jks"

      - name: Upload archive (APK + mapping.txt)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.name }}
          path: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.dir }}/mapping.txt
          retention-days: 90

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BiliSeek ${{ steps.ver.outputs.name }}
          draft: true
          files: |
            ${{ steps.out.outputs.apk }}
            ${{ steps.out.outputs.dir }}/mapping.txt
          body: |
            BiliSeek ${{ steps.ver.outputs.name }}（versionCode ${{ steps.ver.outputs.code }}），commit `${{ github.sha }}`。

            **这是草稿。** 发布前按 docs/发版清单.md §2 逐项确认：
            - [ ] 下载本草稿里的 APK（R8 已开启），真机/模拟器跑通 Part A 核心链路（验收记录 M10 的 F-1~F-6）
            - [ ] mapping.txt 已归档（本草稿附件 + Actions 产物，保留 90 天；请另存一份到长期存储）
            - [ ] 仓库已公开，含 LICENSE（GPLv3）+ NOTICE；设置页「关于 → 源码」链接可打开
            - [ ] 签名密钥有离线备份
            - [ ] 在发版清单 §0.5 表格里登记本版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
